<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Gerador de Relatório PDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6; margin: 0; padding: 24px; color: #111827;
  }
  .container {
    max-width: 1100px; margin: 0 auto; background: #fff;
    padding: 24px; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; margin-top: 0; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #374151; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input[type="file"], select {
    padding: 8px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; background: #fff; font-size: 14px;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-weight: 600;
    cursor: pointer; font-size: 14px;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  button.sec {
    background: #e5e7eb; color: #111827;
  }
  button.sec:hover { background: #d1d5db; }

  /* Caixa de seleção de campos */
  #camposBox {
    display: none;
    border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px; background: #fafafa; margin-bottom: 16px;
  }
  #camposBox .tools {
    display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
  }
  #camposLista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px 14px;
    max-height: 260px; overflow-y: auto;
    padding: 6px 2px;
  }
  #camposLista label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; cursor: pointer; padding: 4px 6px;
    border-radius: 6px;
  }
  #camposLista label:hover { background: #eef2ff; }
  #camposLista input[type="checkbox"] { accent-color: #2563eb; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  th { background: #f9fafb; }
  .status { font-size: 13px; color: #374151; margin-top: 8px; }
  .tag {
    display: inline-block; background: #dbeafe; color: #1e40af;
    font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Gerador de Relatório PDF</h1>

  <div class="row">
    <input type="file" id="csvFile" accept=".csv,text/csv" />
    <div class="status" id="status">Selecione um arquivo CSV para começar.</div>
  </div>

  <!-- ETAPA 1: seleção de campos -->
  <div id="camposBox">
    <h2>1. Escolha os campos que deseja usar <span class="tag" id="contadorCampos">0 selecionados</span></h2>
    <div class="tools">
      <button class="sec" id="btnTodos">Selecionar todos</button>
      <button class="sec" id="btnNenhum">Limpar seleção</button>
      <button class="sec" id="btnEssenciais">Campos essenciais</button>
    </div>
    <div id="camposLista"></div>
  </div>

  <!-- ETAPA 2: preview + filtros + gerar -->
  <div id="etapaFinal" style="display:none;">
    <h2>2. Pré-visualização e geração</h2>

    <div class="row">
      <label style="font-size:13px;">Orientação:
        <select id="orientacao">
          <option value="landscape">Paisagem</option>
          <option value="portrait">Retrato</option>
        </select>
      </label>
      <label style="font-size:13px;">Filtrar por <em>Credenciado</em>:
        <select id="filtroCredenciado">
          <option value="">Todos</option>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>
      </label>
      <button id="btnGerar">📄 Gerar PDF</button>
    </div>

    <div id="preview"></div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

let dadosCSV   = [];    // linhas como objetos
let colunasCSV = [];    // todas as colunas detectadas
let camposSel  = [];    // campos escolhidos pelo usuário

const fileInput   = document.getElementById('csvFile');
const statusEl    = document.getElementById('status');
const camposBox   = document.getElementById('camposBox');
const camposLista = document.getElementById('camposLista');
const contadorEl  = document.getElementById('contadorCampos');
const etapaFinal  = document.getElementById('etapaFinal');
const previewEl   = document.getElementById('preview');

// Palavras-chave para "campos essenciais"
const ESSENCIAIS = ['ID','Nome Completo','Nome Crachá','Email','Celular',
                    'Instituição','Cargo','Categoria','Credenciado','Status Pagamento'];

// ---------------------------------------------
// 1) Leitura do CSV
// ---------------------------------------------
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (result) => {
      colunasCSV = (result.meta.fields || []).filter(Boolean);
      dadosCSV   = result.data;

      if (!colunasCSV.length) {
        statusEl.textContent = '❌ Nenhuma coluna detectada no CSV.';
        return;
      }

      statusEl.textContent =
        `✔️ ${dadosCSV.length} registros e ${colunasCSV.length} colunas carregados.`;

      // Mostra a caixa de seleção de campos
      camposBox.style.display = 'block';
      etapaFinal.style.display = 'none';
      renderCamposLista();

      // Pré-seleciona os essenciais
      selecionarEssenciais();
    },
    error: (err) => {
      statusEl.textContent = '❌ Erro ao ler CSV: ' + err.message;
    }
  });
});

// ---------------------------------------------
// 2) Renderiza a lista de campos (checkboxes)
// ---------------------------------------------
function renderCamposLista() {
  camposLista.innerHTML = colunasCSV.map(col => `
    <label>
      <input type="checkbox" value="${escapeHtml(col)}" data-campo />
      <span>${escapeHtml(col)}</span>
    </label>
  `).join('');

  camposLista.querySelectorAll('input[data-campo]').forEach(chk => {
    chk.addEventListener('change', atualizarSelecao);
  });

  atualizarSelecao();
}

// Atualiza contador, preview e habilita/desabilita a etapa final
function atualizarSelecao() {
  camposSel = [...camposLista.querySelectorAll('input[data-campo]:checked')]
    .map(c => c.value);

  contadorEl.textContent = `${camposSel.length} selecionado${camposSel.length === 1 ? '' : 's'}`;

  if (camposSel.length === 0) {
    etapaFinal.style.display = 'none';
  } else {
    etapaFinal.style.display = 'block';
    renderPreview();
  }
}

// ---------------------------------------------
// 3) Botões auxiliares
// ---------------------------------------------
document.getElementById('btnTodos').addEventListener('click', () => {
  camposLista.querySelectorAll('input[data-campo]').forEach(c => c.checked = true);
  atualizarSelecao();
});
document.getElementById('btnNenhum').addEventListener('click', () => {
  camposLista.querySelectorAll('input[data-campo]').forEach(c => c.checked = false);
  atualizarSelecao();
});
document.getElementById('btnEssenciais').addEventListener('click', selecionarEssenciais);

function selecionarEssenciais() {
  camposLista.querySelectorAll('input[data-campo]').forEach(c => {
    c.checked = ESSENCIAIS.includes(c.value);
  });
  // Se nenhum essencial existir no CSV, marca os 6 primeiros
  if (!camposLista.querySelector('input[data-campo]:checked')) {
    [...camposLista.querySelectorAll('input[data-campo]')]
      .slice(0, 6).forEach(c => c.checked = true);
  }
  atualizarSelecao();
}

// ---------------------------------------------
// 4) Preview na tela (respeita a ordem original do CSV)
// ---------------------------------------------
function renderPreview() {
  if (!camposSel.length || !dadosCSV.length) { previewEl.innerHTML = ''; return; }

  // Mantém a ordem original do CSV
  const colunas = colunasCSV.filter(c => camposSel.includes(c));
  const limite = 15;

  previewEl.innerHTML = `
    <table>
      <thead><tr>${colunas.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
      <tbody>
        ${dadosCSV.slice(0, limite).map(linha => `
          <tr>${colunas.map(c => `<td>${escapeHtml(linha[c] ?? '')}</td>`).join('')}</tr>
        `).join('')}
      </tbody>
    </table>
    ${dadosCSV.length > limite
      ? `<div class="status">Mostrando ${limite} de ${dadosCSV.length} registros.</div>` : ''}
  `;
}

// ---------------------------------------------
// 5) Geração do PDF
// ---------------------------------------------
document.getElementById('btnGerar').addEventListener('click', gerarPDF);

function gerarPDF() {
  if (!camposSel.length || !dadosCSV.length) return;

  const orientacao = document.getElementById('orientacao').value;
  const filtro     = document.getElementById('filtroCredenciado').value;

  // Mantém a ordem original do CSV
  const colunasPDF = colunasCSV.filter(c => camposSel.includes(c));

  // Filtro opcional por "Credenciado" (se existir no CSV)
  let linhas = dadosCSV;
  if (filtro && colunasCSV.includes('Credenciado')) {
    linhas = linhas.filter(l => (l['Credenciado'] || '').trim() === filtro);
  }

  if (!linhas.length) {
    alert('Nenhum registro atende ao filtro selecionado.');
    return;
  }

  const doc = new jsPDF({
    orientation: orientacao,
    unit: 'pt',
    format: 'a4'
  });

  doc.setFontSize(16);
  doc.text('Relatório de Participantes', 40, 40);

  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(
    `Gerado em: ${new Date().toLocaleString('pt-BR')}  |  Registros: ${linhas.length}`,
    40, 58
  );

  doc.autoTable({
    startY: 75,
    head: [colunasPDF],
    body: linhas.map(l => colunasPDF.map(c => l[c] ?? '')),
    styles: {
      fontSize: 8,
      cellPadding: 4,
      overflow: 'linebreak',
      valign: 'middle'
    },
    headStyles: {
      fillColor: [37, 99, 235],
      textColor: 255,
      fontStyle: 'bold'
    },
    alternateRowStyles: { fillColor: [245, 247, 250] },
    margin: { left: 30, right: 30 },
    didDrawPage: () => {
      const pageCount = doc.internal.getNumberOfPages();
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text(
        `Página ${doc.internal.getCurrentPageInfo().pageNumber} de ${pageCount}`,
        doc.internal.pageSize.getWidth() - 80,
        doc.internal.pageSize.getHeight() - 20
      );
    }
  });

  doc.save(`relatorio_${Date.now()}.pdf`);
}

// ---------------------------------------------
// Util
// ---------------------------------------------
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}
</script>
</body>
</html>
